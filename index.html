<!DOCTYPE html>
<html lang="es" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F3">
<meta name="description" content="UniSinú Recompensas: gana puntos por asistir a los eventos de la universidad y canjéalos por beneficios.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>UniSinú Recompensas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23B91C1C'/%3E%3Cpath d='M20 9.5 22.6 16.3H29.8L24 20.5l2.2 6.8-6.2-4.1-6.2 4.1 2.2-6.8L10.2 16.3h7.2L20 9.5Z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   UniSinú Recompensas — App móvil
   Sistema visual: rojo institucional sobre papel cálido, tipografía editorial.
   ========================================================================== */

:root{
  color-scheme: light;
  --brand:#B91C1C;
  --brand-600:#DC2626;
  --brand-700:#B91C1C;
  --brand-800:#991B1B;
  --brand-900:#7F1D1D;
  --brand-100:#FDE7E7;
  --brand-50:#FEF4F3;
  --paper:#FAF8F3;
  --card:#FFFFFF;
  --ink:#1C2420;
  --ink-soft:#5B655F;
  --muted:#98A095;
  --line:#E3E0D5;
  --page:#EFEAE0;
  --ok:#15803D;
  --ok-bg:#E7F5EC;
  --danger:#C4544A;
  --shadow-sm:0 2px 8px rgba(28,36,32,.05);
  --shadow-md:0 12px 30px -14px rgba(28,36,32,.28);
  --shadow-lg:0 30px 60px -20px rgba(28,36,32,.35);
  --radius:18px;
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
}

html[data-theme="dark"]{
  color-scheme: dark;
  --brand:#E23B3B;
  --brand-600:#EF4444;
  --brand-700:#DC2626;
  --brand-800:#B91C1C;
  --brand-900:#7F1D1D;
  --brand-100:#3A1B1B;
  --brand-50:#2A1515;
  --paper:#151513;
  --card:#1E1E1B;
  --ink:#F4F2EA;
  --ink-soft:#ABAFA4;
  --muted:#7F857B;
  --line:#302F29;
  --page:#0C0C0A;
  --ok:#4ADE80;
  --ok-bg:#14301F;
  --danger:#E06A60;
  --shadow-sm:0 2px 8px rgba(0,0,0,.25);
  --shadow-md:0 12px 30px -14px rgba(0,0,0,.55);
  --shadow-lg:0 30px 60px -20px rgba(0,0,0,.7);
}

@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    color-scheme: dark;
    --brand:#E23B3B;
    --brand-600:#EF4444;
    --brand-700:#DC2626;
    --brand-800:#B91C1C;
    --brand-900:#7F1D1D;
    --brand-100:#3A1B1B;
    --brand-50:#2A1515;
    --paper:#151513;
    --card:#1E1E1B;
    --ink:#F4F2EA;
    --ink-soft:#ABAFA4;
    --muted:#7F857B;
    --line:#302F29;
    --page:#0C0C0A;
    --ok:#4ADE80;
    --ok-bg:#14301F;
    --danger:#E06A60;
    --shadow-sm:0 2px 8px rgba(0,0,0,.25);
    --shadow-md:0 12px 30px -14px rgba(0,0,0,.55);
    --shadow-lg:0 30px 60px -20px rgba(0,0,0,.7);
  }
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  min-height:100dvh;
  background:var(--page);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  display:flex;
  justify-content:center;
}
body.no-scroll{overflow:hidden;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;padding:0;}
a{color:inherit;text-decoration:none;}
h1,h2,h3,h4,p{margin:0;}
svg{display:block;}
[hidden]{display:none !important;}
::selection{background:var(--brand-100);color:var(--brand-900);}

:focus-visible{outline:2px solid var(--brand-600);outline-offset:2px;border-radius:8px;}

/* Scrollbars discretos */
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
*::-webkit-scrollbar{width:6px;height:6px;}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
*::-webkit-scrollbar-track{background:transparent;}

/* ============================ Shell ============================ */
.app{
  width:100%;
  max-width:480px;
  height:100dvh;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  position:relative;
  overflow:hidden;
  isolation:isolate;
}

@media (min-width:600px){
  body{align-items:center;padding:20px;}
  .app{
    height:min(920px, calc(100dvh - 40px));
    border-radius:36px;
    box-shadow:var(--shadow-lg), 0 0 0 1px var(--line);
  }
}

/* ============================ Topbar ============================ */
.topbar{
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:calc(12px + var(--safe-t)) 18px 10px;
  background:var(--paper);
  position:relative;
  z-index:6;
}
.topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
.topbar-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.seal{color:var(--brand-700);flex-shrink:0;}
.brand-name{
  font-family:'Newsreader',Georgia,serif;
  font-weight:600;
  font-size:17px;
  line-height:1.15;
  color:var(--ink);
  letter-spacing:-.01em;
  white-space:nowrap;
}
.brand-sub{
  font-size:10.5px;
  color:var(--ink-soft);
  letter-spacing:.02em;
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:210px;
}
.tb-title{
  font-family:'Newsreader',Georgia,serif;
  font-weight:600;
  font-size:20px;
  letter-spacing:-.01em;
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  background:var(--brand-100);
  border:1.5px solid color-mix(in srgb, var(--brand) 45%, transparent);
  display:flex;align-items:center;justify-content:center;
  font-family:'Newsreader',Georgia,serif;
  font-weight:600;font-size:13.5px;color:var(--brand-800);
  flex-shrink:0;
  transition:transform .15s ease;
}
.avatar:active{transform:scale(.94);}
.avatar.big{width:46px;height:46px;font-size:16px;border-radius:14px;}
.role-chip{
  display:inline-block;
  font-family:'Inter',sans-serif;
  font-size:9.5px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--brand-700);
  background:var(--brand-100);
  border-radius:20px;
  padding:3px 8px;
  margin-left:7px;
  vertical-align:2px;
}
.pts-chip{
  font-size:12px;font-weight:800;color:var(--brand-700);
  background:var(--brand-50);
  border:1px solid color-mix(in srgb, var(--brand) 18%, var(--line));
  padding:7px 11px;border-radius:20px;white-space:nowrap;
}
.icon-btn{
  width:38px;height:38px;border-radius:12px;
  border:1px solid var(--line);
  background:var(--card);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
  flex-shrink:0;
  transition:transform .15s ease, background .15s ease;
}
.icon-btn:active{transform:scale(.94);}
.icon-btn.ghost{border-color:transparent;background:transparent;width:34px;height:34px;color:var(--brand-700);}
.icon-btn.danger{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 35%, var(--line));}

/* ============================ View ============================ */
.view{
  flex:1;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:6px 16px 26px;
  scroll-behavior:smooth;
}
.view.page{padding-bottom:34px;}

/* ============================ Tabbar ============================ */
.tabbar{
  flex-shrink:0;
  display:grid;
  grid-template-columns:repeat(var(--tabs,4),1fr);
  align-items:end;
  gap:2px;
  padding:6px 6px calc(8px + var(--safe-b));
  background:color-mix(in srgb, var(--paper) 90%, transparent);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  z-index:20;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:3px;
  min-height:48px;
  padding:4px 0 2px;
  color:var(--muted);
  font-size:10px;font-weight:700;letter-spacing:.01em;
  transition:color .15s ease;
}
.nav-btn .ico-wrap{
  width:32px;height:26px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  transition:background .18s ease, color .18s ease, transform .15s ease;
}
.nav-btn.active{color:var(--brand-700);}
.nav-btn.active .ico-wrap{background:var(--brand-50);}
.nav-btn:active .ico-wrap{transform:scale(.92);}
.nav-btn.center .ico-wrap{
  width:50px;height:50px;border-radius:50%;
  margin-top:-28px;
  background:linear-gradient(160deg, var(--brand-600), var(--brand-900));
  color:#fff;
  border:4px solid var(--paper);
  box-shadow:0 10px 22px -8px color-mix(in srgb, var(--brand) 70%, transparent);
}
.nav-btn.center.active .ico-wrap{
  background:linear-gradient(160deg, var(--brand-600), var(--brand-900));
  color:#fff;
  box-shadow:0 0 0 3px var(--brand-100), 0 12px 24px -8px color-mix(in srgb, var(--brand) 75%, transparent);
}
.nav-btn.center .nav-label{margin-top:-1px;}

/* ============================ Tipografía / secciones ============================ */
.section-label{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);
  margin:22px 2px 10px;
}
.section-label.first{margin-top:6px;}
.section-label .link{
  font-size:11px;font-weight:800;letter-spacing:.02em;text-transform:none;
  color:var(--brand-700);
  padding:4px 2px;
}
.serif{font-family:'Newsreader',Georgia,serif;}
.muted{color:var(--ink-soft);}
.small{font-size:12px;line-height:1.5;color:var(--ink-soft);}

/* ============================ Botones ============================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;
  padding:13px 18px;
  border-radius:14px;
  font-weight:700;font-size:14.5px;
  border:1px solid transparent;
  transition:transform .15s ease, filter .15s ease, background .15s ease;
  text-align:center;
}
.btn:active{transform:scale(.985);}
.btn.primary{background:var(--brand-700);color:#fff;width:100%;box-shadow:0 8px 18px -10px color-mix(in srgb, var(--brand) 80%, transparent);}
.btn.primary:hover{filter:brightness(1.05);}
.btn.secondary{background:var(--brand-50);color:var(--brand-800);border-color:color-mix(in srgb, var(--brand) 22%, var(--line));width:100%;}
.btn.ghost{background:transparent;color:var(--ink-soft);width:100%;font-weight:600;}
.btn.danger{background:var(--danger);color:#fff;width:100%;}
.btn.small{min-height:38px;padding:8px 14px;font-size:12.5px;border-radius:11px;width:auto;}
.btn[disabled],.btn:disabled{opacity:.55;pointer-events:none;}
.btn-row{display:flex;gap:9px;}
.btn-row .btn{flex:1;}
.text-link{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--brand-700);font-size:12.5px;font-weight:800;
  padding:4px 0;
}

/* ============================ Balance ============================ */
.balance-card{
  position:relative;
  overflow:hidden;
  border-radius:22px;
  padding:22px 20px 19px;
  color:#F7F1E6;
  background:
    radial-gradient(120% 120% at 100% 0%, rgba(255,255,255,.16) 0%, transparent 45%),
    linear-gradient(155deg, #C22A2A 0%, var(--brand-700) 45%, var(--brand-900) 100%);
  box-shadow:0 18px 34px -22px color-mix(in srgb, var(--brand-900) 85%, transparent);
  margin-bottom:16px;
}
.balance-card .ring{
  position:absolute;border:1.5px solid rgba(255,255,255,.22);border-radius:50%;
  pointer-events:none;
}
.balance-card .ring.r1{width:160px;height:160px;right:-46px;top:-52px;}
.balance-card .ring.r2{width:96px;height:96px;right:-10px;top:-16px;border-color:rgba(255,255,255,.14);}
.balance-label{font-size:10.5px;letter-spacing:.12em;font-weight:800;color:rgba(255,255,255,.78);margin-bottom:7px;}
.balance-row{display:flex;align-items:baseline;gap:8px;position:relative;}
.balance-num{
  font-family:'Newsreader',Georgia,serif;
  font-weight:500;
  font-size:42px;
  line-height:1;
  letter-spacing:-.02em;
}
.balance-unit{font-size:13px;color:rgba(255,255,255,.72);}
.level-row{display:flex;align-items:center;gap:11px;margin-top:17px;position:relative;}
.level-track{flex:1;height:6px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;}
.level-fill{height:100%;background:#fff;border-radius:6px;transition:width .6s cubic-bezier(.22,1,.36,1);}
.level-text{font-size:10.5px;color:rgba(255,255,255,.82);white-space:nowrap;font-weight:600;}

/* ============================ Tarjetas ============================ */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:15px;
  margin-bottom:10px;
}
.info-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px 16px;
  margin-bottom:10px;
}
.info-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;}
.info-body{font-size:12.5px;color:var(--ink-soft);line-height:1.55;}

/* CTA QR en inicio */
.qr-cta{
  width:100%;
  display:flex;align-items:center;gap:13px;
  background:var(--card);
  border:1px solid color-mix(in srgb, var(--brand) 24%, var(--line));
  border-radius:16px;
  padding:13px 14px;
  text-align:left;
  color:var(--ink);
  margin-bottom:10px;
  box-shadow:var(--shadow-sm);
  transition:transform .15s ease;
}
.qr-cta:active{transform:scale(.99);}
.qr-cta .qr-cta-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:linear-gradient(160deg,var(--brand-600),var(--brand-900));
  color:#fff;display:flex;align-items:center;justify-content:center;
}
.qr-cta .qr-cta-body{flex:1;min-width:0;}
.qr-cta .qr-cta-title{font-size:14px;font-weight:700;}
.qr-cta .qr-cta-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.qr-cta .chev{color:var(--muted);flex-shrink:0;}

/* ============================ Eventos ============================ */
.event-card{
  width:100%;
  display:flex;align-items:center;gap:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
  margin-bottom:9px;
  text-align:left;
  color:var(--ink);
  box-shadow:var(--shadow-sm);
  transition:transform .15s ease, border-color .15s ease;
}
.event-card:active{transform:scale(.99);border-color:color-mix(in srgb,var(--brand) 30%,var(--line));}
.date-chip{
  width:46px;flex-shrink:0;
  background:var(--brand-100);
  border-radius:11px;
  text-align:center;
  padding:7px 0 6px;
}
.date-chip b{
  display:block;
  font-family:'Newsreader',Georgia,serif;
  font-weight:600;font-size:17px;color:var(--brand-800);line-height:1;
}
.date-chip span{
  display:block;
  font-size:9px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--brand-700);margin-top:3px;font-weight:700;
}
.event-body{flex:1;min-width:0;display:block;}
.event-title{display:block;font-size:13.5px;font-weight:700;line-height:1.3;color:var(--ink);}
.event-meta{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.35;}
.event-pts{
  align-self:center;
  font-size:12px;font-weight:800;color:var(--brand-700);
  white-space:nowrap;
}
.event-card.dim{opacity:.62;}
.tag{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;font-weight:800;letter-spacing:.01em;
  padding:3px 7px;border-radius:20px;margin-top:6px;
}
.tag.ok{background:var(--ok-bg);color:var(--ok);}
.tag.off{background:color-mix(in srgb,var(--line) 55%, transparent);color:var(--ink-soft);}
.tag.brand{background:var(--brand-100);color:var(--brand-800);}

/* ============================ Tabs / búsqueda ============================ */
.tabs{
  display:flex;gap:7px;
  overflow-x:auto;
  padding:2px 0 12px;
  margin:0 -2px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  flex-shrink:0;
  font-size:12px;font-weight:700;
  padding:8px 14px;border-radius:20px;
  border:1px solid var(--line);
  color:var(--ink-soft);
  background:var(--card);
  transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.tab.active{background:var(--brand-700);color:#fff;border-color:var(--brand-700);}
.search-row{
  display:flex;align-items:center;gap:9px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  padding:0 13px;
  margin-bottom:12px;
  color:var(--muted);
  min-height:46px;
}
.search-row input{
  flex:1;min-width:0;
  border:0;outline:0;background:transparent;
  font-size:16px;
  padding:12px 0;
  color:var(--ink);
}
.search-row input::placeholder{color:var(--muted);font-size:13.5px;}

/* ============================ Recompensas ============================ */
.reward-card{
  display:flex;align-items:center;gap:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px;
  margin-bottom:9px;
}
.reward-icon{
  width:44px;height:44px;flex-shrink:0;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  background:var(--brand-100);color:var(--brand-700);
}
.reward-card.locked .reward-icon{background:color-mix(in srgb,var(--line) 45%, transparent);color:var(--muted);}
.reward-body{flex:1;min-width:0;}
.reward-title{font-size:13px;font-weight:700;line-height:1.3;color:var(--ink);}
.reward-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}
.reward-cost{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.reward-cost .pts{font-size:12px;font-weight:800;color:var(--brand-700);white-space:nowrap;}
.reward-card.locked .pts{color:var(--muted);}
.redeem-pill{
  font-size:10.5px;font-weight:800;color:var(--brand-700);
  border:1.4px solid color-mix(in srgb,var(--brand) 60%, var(--line));
  border-radius:20px;
  padding:5px 11px;
  min-height:28px;
  background:transparent;
  white-space:nowrap;
}
.redeem-pill:active{background:var(--brand-50);}
.redeem-pill.locked{color:var(--muted);border-color:var(--line);pointer-events:none;}

/* ============================ KPI / admin ============================ */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px;}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;box-shadow:var(--shadow-sm);}
.kpi-num{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:24px;color:var(--ink);line-height:1;}
.kpi-label{font-size:10.5px;color:var(--ink-soft);margin-top:5px;line-height:1.3;}
.kpi-delta{font-size:10px;color:var(--brand-700);font-weight:800;margin-top:7px;}
.quick-row{
  width:100%;
  display:flex;align-items:center;gap:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px 14px;
  margin-bottom:9px;
  text-align:left;
  color:var(--ink);
  transition:transform .15s ease;
}
.quick-row:active{transform:scale(.99);}
.quick-icon{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:var(--brand-100);color:var(--brand-700);
  display:flex;align-items:center;justify-content:center;
}
.quick-title{font-size:13.5px;font-weight:700;}
.quick-meta{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.quick-chevron{margin-left:auto;color:var(--muted);flex-shrink:0;}

/* ============================ Filas CRUD ============================ */
.crud-row{
  display:flex;align-items:center;gap:10px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:11px 12px;
  margin-bottom:9px;
}
.crud-main{
  flex:1;min-width:0;
  display:flex;align-items:center;gap:10px;
  background:none;border:0;padding:0;
  text-align:left;color:inherit;
}
.crud-avatar{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:var(--brand-100);color:var(--brand-700);
  display:flex;align-items:center;justify-content:center;
  font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:13px;
}
.crud-date{
  width:42px;flex-shrink:0;
  background:var(--brand-100);
  border-radius:10px;
  text-align:center;
  padding:6px 0 5px;
}
.crud-date b{display:block;font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:15px;color:var(--brand-800);line-height:1;}
.crud-date span{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--brand-700);font-weight:700;margin-top:2px;}
.crud-body{flex:1;min-width:0;}
.crud-title{font-size:13px;font-weight:700;line-height:1.3;color:var(--ink);}
.crud-meta{
  font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.3;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;
}
.crud-value{font-size:12px;font-weight:800;color:var(--brand-700);white-space:nowrap;margin-right:1px;}
.crud-value.dim{color:var(--muted);}
.crud-actions{display:flex;gap:6px;flex-shrink:0;}
.mini-btn{
  width:32px;height:32px;border-radius:9px;
  border:1px solid var(--line);
  background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft);
  flex-shrink:0;
  transition:transform .15s ease;
}
.mini-btn:active{transform:scale(.92);}
.mini-btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,var(--line));}
.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0;}
.status-dot.on{background:var(--brand-600);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-600) 16%,transparent);}
.status-dot.off{background:var(--muted);}

/* ============================ QR estudiante ============================ */
.qr-hero{text-align:center;padding:8px 8px 2px;}
.qr-hero h2{
  font-family:'Newsreader',Georgia,serif;
  font-style:italic;font-weight:500;
  font-size:23px;color:var(--ink);margin-bottom:6px;
}
.qr-hero p{font-size:12.5px;color:var(--ink-soft);max-width:280px;margin:0 auto;line-height:1.55;}
.qr-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:20px 18px 16px;
  margin:16px 0 12px;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  box-shadow:var(--shadow-md);
}
.qr-frame{
  position:relative;
  width:198px;height:198px;
  background:#FFFFFF;
  border-radius:16px;
  border:1px solid var(--line);
  padding:13px;
  box-shadow:0 10px 24px -14px rgba(28,36,32,.3);
}
.qr-svg{width:100%;height:100%;}
.qr-svg svg{width:100%;height:100%;}
.qr-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:40px;height:40px;border-radius:11px;
  background:linear-gradient(160deg,var(--brand-600),var(--brand-900));
  border:3.5px solid #fff;
  display:flex;align-items:center;justify-content:center;
  color:#fff;
  box-shadow:0 3px 10px rgba(0,0,0,.18);
}
.qr-name{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:17px;color:var(--ink);text-align:center;line-height:1.2;}
.qr-id{font-size:11.5px;color:var(--ink-soft);text-align:center;margin-top:-6px;line-height:1.4;}
.qr-timer{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--muted);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:20px;
  padding:6px 11px;
}
.qr-timer b{color:var(--brand-700);font-variant-numeric:tabular-nums;}
.event-target{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:13px 14px;
  margin-bottom:10px;
}
.event-target .event-title{font-size:13px;}
.event-target .event-meta{font-size:11px;}
.select-plain{
  width:100%;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:12px;
  padding:12px 13px;
  font-size:16px;
  color:var(--ink);
  margin-bottom:10px;
  appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2398A095' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 13px center;
  padding-right:38px;
}

/* ============================ Escáner ============================ */
.counter-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(155deg,#C22A2A 0%,var(--brand-700) 50%,var(--brand-900) 100%);
  color:#F7F1E6;
  border-radius:18px;
  padding:14px 16px;
  margin-bottom:14px;
}
.counter-bar .n{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:23px;line-height:1;}
.counter-bar .l{font-size:10px;color:rgba(255,255,255,.72);margin-top:3px;font-weight:600;}
.counter-bar .divider{width:1px;height:30px;background:rgba(255,255,255,.22);}
.viewfinder{
  position:relative;
  aspect-ratio:4/3;
  border-radius:20px;
  overflow:hidden;
  background:#0E1410;
  margin-bottom:12px;
  border:1px solid #000;
}
.viewfinder video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;
  opacity:.92;
}
.viewfinder .veil{
  position:absolute;inset:0;
  background:radial-gradient(70% 60% at 50% 45%, transparent 30%, rgba(0,0,0,.35) 100%);
  pointer-events:none;
}
.corner{position:absolute;width:32px;height:32px;border:2.5px solid #fff;z-index:2;}
.corner.tl{top:18px;left:18px;border-right:none;border-bottom:none;border-radius:10px 0 0 0;}
.corner.tr{top:18px;right:18px;border-left:none;border-bottom:none;border-radius:0 10px 0 0;}
.corner.bl{bottom:18px;left:18px;border-right:none;border-top:none;border-radius:0 0 0 10px;}
.corner.br{bottom:18px;right:18px;border-left:none;border-top:none;border-radius:0 0 10px 0;}
.scan-line{
  position:absolute;left:22px;right:22px;top:20%;
  height:2px;
  background:linear-gradient(90deg,transparent,#FF5A5A,transparent);
  box-shadow:0 0 12px #FF5A5A;
  animation:scanline 2.2s ease-in-out infinite;
  z-index:2;
}
@keyframes scanline{0%,100%{top:22%;opacity:.4}50%{top:78%;opacity:1}}
.scan-status{
  position:absolute;left:12px;right:12px;bottom:12px;
  background:rgba(8,10,8,.62);
  color:#F2F1EA;
  font-size:11px;line-height:1.4;
  padding:8px 11px;border-radius:10px;
  text-align:center;
  -webkit-backdrop-filter:blur(6px);
  backdrop-filter:blur(6px);
  z-index:3;
}
.scan-form{display:flex;gap:8px;margin-bottom:8px;}
.scan-form input{
  flex:1;min-width:0;
  border:1px solid var(--line);
  background:var(--card);
  border-radius:12px;
  padding:12px 13px;
  font-size:16px;
  color:var(--ink);
}
.scan-form .btn{width:auto;flex-shrink:0;padding-left:16px;padding-right:16px;}
.scan-result{
  display:flex;align-items:center;gap:10px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:9px 12px;
  margin-bottom:8px;
}
.scan-check{
  width:28px;height:28px;border-radius:50%;
  background:var(--ok-bg);color:var(--ok);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.scan-name{font-size:13px;font-weight:700;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.scan-pts{font-size:11.5px;font-weight:800;color:var(--brand-700);white-space:nowrap;}

/* ============================ Formularios ============================ */
.form-group{margin-bottom:13px;}
.form-label{
  display:block;
  font-size:11px;font-weight:800;letter-spacing:.03em;
  color:var(--ink-soft);
  margin-bottom:6px;
}
.input,.select,.textarea{
  width:100%;
  border:1.3px solid var(--line);
  border-radius:12px;
  padding:12px 13px;
  font-size:16px;
  color:var(--ink);
  background:var(--card);
  outline:0;
  transition:border-color .15s ease, box-shadow .15s ease;
}
.input:focus,.select:focus,.textarea:focus{
  border-color:var(--brand-600);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-600) 14%,transparent);
}
.textarea{resize:vertical;min-height:76px;line-height:1.45;}
.select{
  appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2398A095' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 13px center;
  padding-right:38px;
}
.form-row-2{display:flex;gap:10px;}
.form-row-2 .form-group{flex:1;min-width:0;}
.toggle-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  padding:12px 14px;
  margin-bottom:14px;
  cursor:pointer;
}
.toggle-row .form-label{margin:0;font-size:12px;font-weight:700;letter-spacing:0;color:var(--ink);line-height:1.35;}
.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.toggle{
  width:42px;height:24px;border-radius:20px;
  background:var(--line);
  position:relative;flex-shrink:0;
  transition:background .18s ease;
}
.toggle::after{
  content:"";position:absolute;top:3px;left:3px;
  width:18px;height:18px;border-radius:50%;
  background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.25);
  transition:transform .18s ease;
}
input:checked + .toggle{background:var(--brand-600);}
input:checked + .toggle::after{transform:translateX(18px);}
input:focus-visible + .toggle{outline:2px solid var(--brand-600);outline-offset:2px;}

/* ============================ Perfil ============================ */
.profile-head{
  display:flex;align-items:center;gap:14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px 16px;
  margin-bottom:10px;
  box-shadow:var(--shadow-sm);
}
.profile-avatar{
  width:58px;height:58px;border-radius:18px;
  background:var(--brand-100);
  color:var(--brand-800);
  display:flex;align-items:center;justify-content:center;
  font-family:'Newsreader',Georgia,serif;
  font-weight:600;font-size:20px;flex-shrink:0;
}
.profile-name{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:19px;line-height:1.15;color:var(--ink);}
.profile-meta{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
.stat{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 8px;
  text-align:center;
}
.stat b{display:block;font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:20px;line-height:1;color:var(--ink);}
.stat span{display:block;font-size:9.5px;color:var(--ink-soft);margin-top:5px;font-weight:600;line-height:1.25;}
.list-row{
  display:flex;align-items:center;gap:10px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px 12px;
  margin-bottom:8px;
}
.list-row .lr-body{flex:1;min-width:0;}
.list-row .lr-title{font-size:12.5px;font-weight:700;line-height:1.3;color:var(--ink);}
.list-row .lr-meta{font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.list-row .lr-value{font-size:12px;font-weight:800;color:var(--brand-700);white-space:nowrap;}
.list-row .lr-value.off{color:var(--muted);}
.voucher-code{
  font-family:'Inter',monospace;
  font-size:15px;font-weight:800;letter-spacing:.14em;
  color:var(--brand-800);
  background:var(--brand-50);
  border:1px dashed color-mix(in srgb,var(--brand) 40%,var(--line));
  border-radius:11px;
  padding:10px 12px;
  text-align:center;
  margin-top:4px;
}
.settings-row{
  width:100%;
  display:flex;align-items:center;gap:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:13px 14px;
  margin-bottom:8px;
  text-align:left;
  color:var(--ink);
}
.settings-row .sr-icon{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:var(--brand-100);color:var(--brand-700);
  display:flex;align-items:center;justify-content:center;
}
.settings-row .sr-body{flex:1;min-width:0;}
.settings-row .sr-title{font-size:13px;font-weight:700;}
.settings-row .sr-sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
.settings-row .chev{color:var(--muted);flex-shrink:0;}
.settings-row.danger .sr-icon{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);}
.settings-row.danger .sr-title{color:var(--danger);}

/* ============================ Vacíos ============================ */
.empty{
  text-align:center;
  padding:26px 18px 22px;
  background:var(--card);
  border:1px dashed var(--line);
  border-radius:16px;
  margin-bottom:10px;
}
.empty .empty-icon{
  width:46px;height:46px;border-radius:14px;
  background:var(--brand-50);color:var(--brand-700);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 10px;
}
.empty b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:3px;}
.empty p{font-size:12px;color:var(--ink-soft);line-height:1.5;max-width:260px;margin:0 auto;}

/* ============================ FAB ============================ */
.fab{
  position:absolute;
  right:18px;
  bottom:calc(88px + var(--safe-b));
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(160deg,var(--brand-600),var(--brand-900));
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 12px 24px -8px color-mix(in srgb,var(--brand) 75%, transparent);
  z-index:15;
  transition:transform .15s ease;
}
.fab:active{transform:scale(.93);}

/* ============================ Login ============================ */
.login{
  height:100%;
  overflow-y:auto;
  background:var(--paper);
  display:flex;flex-direction:column;
  padding-bottom:calc(28px + var(--safe-b));
}
.login-hero{
  position:relative;
  overflow:hidden;
  padding:calc(38px + var(--safe-t)) 26px 64px;
  color:#F7F1E6;
  background:
    radial-gradient(110% 90% at 90% 0%, rgba(255,255,255,.16) 0%, transparent 50%),
    radial-gradient(80% 60% at 0% 100%, rgba(0,0,0,.28) 0%, transparent 60%),
    linear-gradient(155deg,#C22A2A 0%, var(--brand-700) 42%, var(--brand-900) 100%);
}
.login-hero .ring{position:absolute;border:1.5px solid rgba(255,255,255,.18);border-radius:50%;pointer-events:none;}
.login-hero .ring.r1{width:240px;height:240px;right:-90px;top:-80px;}
.login-hero .ring.r2{width:150px;height:150px;right:-20px;top:-10px;border-color:rgba(255,255,255,.12);}
.login-hero .seal{color:#fff;margin-bottom:18px;position:relative;}
.login-hero h1{
  font-family:'Newsreader',Georgia,serif;
  font-weight:500;
  font-size:38px;
  line-height:1.02;
  letter-spacing:-.02em;
  position:relative;
}
.login-hero h1 em{font-style:italic;color:#FFD9D4;}
.login-hero p{
  position:relative;
  font-size:13px;
  line-height:1.6;
  color:rgba(255,255,255,.8);
  max-width:300px;
  margin-top:14px;
}
.login-card{
  position:relative;
  margin:-38px 16px 0;
  background:var(--paper);
  border-radius:24px;
  padding:20px 16px 18px;
  box-shadow:var(--shadow-lg);
  border:1px solid var(--line);
}
.login-label{
  font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 2px 10px;
}
.seg{
  display:grid;
  gap:5px;
  background:color-mix(in srgb,var(--line) 40%, transparent);
  border-radius:14px;
  padding:4px;
  margin-bottom:14px;
}
.seg.seg-3{grid-template-columns:repeat(3,1fr);}
.seg.seg-2{grid-template-columns:repeat(2,1fr);}
.seg.seg-4{grid-template-columns:repeat(4,1fr);}
.seg-btn{
  font-size:11.5px;font-weight:700;
  padding:9px 6px;border-radius:11px;
  color:var(--ink-soft);
  min-height:38px;
  transition:background .15s ease,color .15s ease,box-shadow .15s ease;
}
.seg-btn.active{background:var(--card);color:var(--brand-800);box-shadow:0 2px 8px rgba(28,36,32,.08);}
.account{
  width:100%;
  display:flex;align-items:center;gap:12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:15px;
  padding:11px 12px;
  margin-bottom:8px;
  text-align:left;
  color:var(--ink);
  transition:transform .15s ease, border-color .15s ease;
}
.account:active{transform:scale(.99);border-color:color-mix(in srgb,var(--brand) 35%,var(--line));}
.account-body{flex:1;min-width:0;}
.account-body b{display:block;font-size:13.5px;font-weight:700;line-height:1.3;}
.account-body small{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.account-go{color:var(--muted);flex-shrink:0;}
.login-note{
  font-size:10.5px;color:var(--muted);line-height:1.5;
  text-align:center;margin:10px 8px 0;
}
.login-foot{
  text-align:center;
  font-size:10.5px;color:var(--muted);
  padding:16px 20px 0;
}

/* ============================ Sheet / modal ============================ */
#sheet-root{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;}
.sheet-backdrop{
  position:absolute;inset:0;
  background:rgba(10,12,10,.5);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
  animation:fadeIn .18s ease;
  display:flex;align-items:flex-end;justify-content:center;
  width:100%;
}
.sheet{
  width:100%;max-width:480px;
  background:var(--paper);
  border-radius:24px 24px 0 0;
  border:1px solid var(--line);
  border-bottom:0;
  padding:10px 18px calc(20px + var(--safe-b));
  max-height:88dvh;
  overflow-y:auto;
  animation:slideUp .24s cubic-bezier(.22,1,.36,1);
  position:relative;
}
.sheet::before{
  content:"";display:block;width:38px;height:4px;border-radius:4px;
  background:var(--line);margin:2px auto 14px;
}
.sheet-title{
  font-family:'Newsreader',Georgia,serif;
  font-weight:600;font-size:21px;line-height:1.2;
  color:var(--ink);margin-bottom:6px;
  padding-right:26px;
}
.sheet-text{font-size:13px;color:var(--ink-soft);line-height:1.6;}
.sheet-actions{display:flex;gap:9px;margin-top:18px;}
.sheet-actions .btn{flex:1;}
.sheet-close{
  position:absolute;top:12px;right:14px;
  width:32px;height:32px;border-radius:10px;
  color:var(--muted);
  display:flex;align-items:center;justify-content:center;
}
.sheet-hero{
  display:flex;align-items:center;gap:13px;
  margin-bottom:14px;
}
.sheet-icon{
  width:48px;height:48px;border-radius:14px;flex-shrink:0;
  background:var(--brand-100);color:var(--brand-700);
  display:flex;align-items:center;justify-content:center;
}
.sheet-icon.ok{background:var(--ok-bg);color:var(--ok);}
.sheet-kicker{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand-700);margin-bottom:3px;}
.detail-rows{margin:14px 0;border-top:1px solid var(--line);}
.detail-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:11px 0;border-bottom:1px solid var(--line);
  font-size:12.5px;
}
.detail-row .k{color:var(--ink-soft);display:flex;align-items:center;gap:7px;flex-shrink:0;}
.detail-row .v{font-weight:700;color:var(--ink);text-align:right;line-height:1.35;}
.success-hero{text-align:center;padding:8px 6px 4px;}
.success-hero .big-check{
  width:58px;height:58px;border-radius:50%;
  background:var(--ok-bg);color:var(--ok);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 12px;
}
.success-hero h3{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:22px;color:var(--ink);margin-bottom:4px;}
.success-hero p{font-size:12.5px;color:var(--ink-soft);line-height:1.55;max-width:280px;margin:0 auto;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(26px);opacity:.4}to{transform:translateY(0);opacity:1}}

/* ============================ Toast ============================ */
#toast{
  position:fixed;
  left:50%;
  bottom:calc(96px + var(--safe-b));
  transform:translate(-50%, 14px);
  z-index:120;
  max-width:min(88vw, 420px);
  background:#1C2420;
  color:#F7F5EE;
  font-size:12.5px;
  font-weight:600;
  line-height:1.4;
  padding:11px 16px;
  border-radius:12px;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.5);
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  text-align:center;
}
html[data-theme="dark"] #toast{background:#F4F2EA;color:#1C2420;}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"] #toast{background:#F4F2EA;color:#1C2420;}
}
#toast.show{opacity:1;transform:translate(-50%,0);}
#toast.error{background:var(--danger);color:#fff;}

/* ============================ Utilidades ============================ */
.stack-6 > * + *{margin-top:6px;}
.mt-8{margin-top:8px;}
.mt-12{margin-top:12px;}
.mt-16{margin-top:16px;}
.mb-0{margin-bottom:0;}
.center{text-align:center;}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.hint{
  display:flex;gap:9px;align-items:flex-start;
  font-size:11px;line-height:1.5;color:var(--ink-soft);
  background:color-mix(in srgb,var(--brand-50) 70%, transparent);
  border:1px solid color-mix(in srgb,var(--brand) 14%, var(--line));
  border-radius:12px;
  padding:10px 12px;
}
.hint svg{flex-shrink:0;color:var(--brand-700);margin-top:1px;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.count-badge{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:20px;padding:0 6px;
  border-radius:10px;
  background:var(--brand-100);color:var(--brand-800);
  font-size:10.5px;font-weight:800;
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}

/* ==========================================================================
   Capa de componentes de las vistas
   ========================================================================== */

/* Botones compactos */
.btn.sm{width:auto;min-height:38px;padding:9px 13px;font-size:12.5px;border-radius:11px;}
.btn.xs{width:auto;min-height:30px;padding:6px 10px;font-size:11px;border-radius:9px;font-weight:800;}
.btn.block{width:100%;}

/* Encabezados de página */
.page-pad{padding:4px 0 8px;}
.page-intro{margin:2px 2px 14px;}
.page-intro h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:25px;letter-spacing:-.01em;color:var(--ink);line-height:1.1;}
.page-intro p{font-size:12px;color:var(--ink-soft);margin-top:5px;line-height:1.5;}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-700);}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 10px;}
.section-head .section-label{margin:0;}
.link-btn{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--brand-700);padding:3px 0;white-space:nowrap;}
.view-foot{text-align:center;font-size:10px;color:var(--muted);padding:18px 0 6px;}

/* Inicio */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 14px;}
.home-title{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:27px;line-height:1.05;letter-spacing:-.015em;color:var(--ink);margin-top:2px;}
.streak{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;color:var(--brand-700);background:var(--brand-50);border:1px solid color-mix(in srgb,var(--brand) 16%,var(--line));border-radius:20px;padding:5px 9px;white-space:nowrap;}
.quick-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;background:none;border:0;padding:0;margin:0 0 4px;box-shadow:none;}
.quick{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px;text-align:left;color:var(--ink);box-shadow:var(--shadow-sm);min-width:0;}

.quick > span:last-child{display:block;min-width:0;}
.quick-ico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--brand-100);color:var(--brand-700);}
.quick-ico.gold{background:#FBF0D9;color:#9A6B14;}
.quick b{display:block;font-size:12.5px;font-weight:700;line-height:1.2;}
.quick small{display:block;font-size:9.5px;color:var(--ink-soft);margin-top:2px;line-height:1.25;}
html[data-theme="dark"] .quick-ico.gold{background:#33290F;color:#E3B65A;}
@media (prefers-color-scheme: dark){html[data-theme="auto"] .quick-ico.gold{background:#33290F;color:#E3B65A;}}
.feature-card{width:100%;display:flex;flex-direction:column;gap:7px;text-align:left;background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.16),transparent 50%),linear-gradient(150deg,#C22A2A,var(--brand-800) 55%,var(--brand-900));color:#F7F1E6;border-radius:20px;padding:16px 16px 14px;box-shadow:0 16px 30px -20px color-mix(in srgb,var(--brand-900) 85%,transparent);}
.feature-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.feature-card .tag{margin:0;}
.tag.light{background:rgba(255,255,255,.16);color:#FFE9E5;}
.feature-pts{font-size:11.5px;font-weight:800;color:#FFD9D4;}
.feature-title{display:block;font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:20px;line-height:1.15;letter-spacing:-.01em;}
.feature-meta{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.75);}
.feature-cta{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#fff;margin-top:2px;}
.activity-list{display:flex;flex-direction:column;gap:7px;}
.activity{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;}
.activity-ico{width:28px;height:28px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.activity-ico.gold{background:#FBF0D9;color:#9A6B14;}
.activity-body{flex:1;min-width:0;display:block;}
.activity-body b{display:block;font-size:12px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.activity-body small{display:block;font-size:10px;color:var(--ink-soft);margin-top:1px;}
.activity-pts{font-size:11.5px;font-weight:800;color:var(--brand-700);white-space:nowrap;}

.how-card{background:var(--brand-50);border:1px solid color-mix(in srgb,var(--brand) 14%,var(--line));border-radius:15px;padding:13px 15px;margin-top:18px;}
.how-title{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;color:var(--brand-800);margin-bottom:7px;}
.how-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;}
.how-list li{font-size:11.5px;color:var(--ink-soft);line-height:1.4;}
.how-list b{color:var(--brand-700);margin-right:3px;}

/* Filtros y búsqueda */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;margin:0 -2px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;font-size:11.5px;font-weight:700;padding:7px 13px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);white-space:nowrap;}

.search-wrap{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:0 12px;margin-bottom:11px;color:var(--muted);min-height:44px;}
.search-input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;padding:11px 0;color:var(--ink);}
.search-input::placeholder{color:var(--muted);font-size:13px;}
.search-input.plain{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:10px 12px;min-width:0;}
.no-results{margin-top:4px;}

/* Panel */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px;}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 13px;box-shadow:var(--shadow-sm);}
.kpi-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;background:var(--brand-100);color:var(--brand-700);}

.kpi-ico.gold{background:#FBF0D9;color:#9A6B14;}
.kpi-ico.blue{background:#E4EEF8;color:#2C5F8A;}
html[data-theme="dark"] .kpi-ico.gold{background:#33290F;color:#E3B65A;}
html[data-theme="dark"] .kpi-ico.blue{background:#16283A;color:#8BB8DC;}
@media (prefers-color-scheme: dark){html[data-theme="auto"] .kpi-ico.gold{background:#33290F;color:#E3B65A;}html[data-theme="auto"] .kpi-ico.blue{background:#16283A;color:#8BB8DC;}}
.kpi b{display:block;font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:25px;line-height:1;color:var(--ink);}
.kpi > span:last-child{display:block;font-size:10px;color:var(--ink-soft);margin-top:4px;font-weight:600;line-height:1.3;}
.dash-note{display:flex;align-items:flex-start;gap:8px;font-size:11px;line-height:1.5;color:var(--ink-soft);background:var(--brand-50);border:1px solid color-mix(in srgb,var(--brand) 12%,var(--line));border-radius:12px;padding:10px 12px;}
.dash-note svg{flex-shrink:0;color:var(--brand-700);margin-top:1px;}
.dash-note b{color:var(--brand-800);}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;display:flex;flex-direction:column;gap:10px;}
.chart-row{display:grid;grid-template-columns:96px 1fr 26px;align-items:center;gap:9px;}
.chart-label{font-size:10px;color:var(--ink-soft);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chart-track{height:7px;border-radius:6px;background:color-mix(in srgb,var(--line) 55%,transparent);overflow:hidden;}
.chart-bar{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand-600),var(--brand-800));min-width:4px;}
.chart-value{font-size:10.5px;font-weight:800;color:var(--ink-soft);text-align:right;font-variant-numeric:tabular-nums;}
.rank{width:20px;height:20px;border-radius:50%;background:var(--brand-100);color:var(--brand-800);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* Personas */
.people-list{display:flex;flex-direction:column;gap:7px;}
.person{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 12px;text-align:left;color:var(--ink);width:100%;}
.person-body{flex:1;min-width:0;}
.person-body b{display:block;font-size:12.5px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.person-body small{display:block;font-size:10px;color:var(--ink-soft);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.person-meta{text-align:right;flex-shrink:0;}
.person-meta b{display:block;font-size:12px;font-weight:800;color:var(--brand-700);line-height:1.2;}
.person-meta small{display:block;font-size:9.5px;color:var(--muted);margin-top:1px;}
.person.as-button:active{transform:scale(.995);}
.avatar.sm{width:30px;height:30px;border-radius:9px;font-size:10.5px;}
.avatar.xl{width:68px;height:68px;border-radius:22px;font-size:23px;margin:0 auto;}

/* Detalle de evento */
.detail-hero{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow-sm);}
.detail-date{width:56px;flex-shrink:0;background:var(--brand-100);border-radius:13px;text-align:center;padding:9px 0 8px;}
.detail-date b{display:block;font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:22px;color:var(--brand-800);line-height:1;}
.detail-date span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-700);font-weight:700;margin-top:2px;}
.detail-date small{display:block;font-size:8.5px;color:var(--brand-700);opacity:.7;margin-top:1px;}
.detail-hero-body{flex:1;min-width:0;}
.detail-hero-body .tag{margin:0 0 6px;}
.detail-hero-body h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:20px;line-height:1.15;letter-spacing:-.01em;color:var(--ink);}
.detail-sub{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.35;}
.detail-points{display:flex;align-items:center;gap:10px;background:linear-gradient(150deg,var(--brand-50),color-mix(in srgb,var(--brand-100) 55%,var(--card)));border:1px solid color-mix(in srgb,var(--brand) 18%,var(--line));border-radius:14px;padding:11px 13px;margin:10px 0;color:var(--brand-800);}
.detail-points b{display:block;font-size:14px;font-weight:800;}
.detail-points small{display:block;font-size:10px;color:var(--brand-700);opacity:.85;margin-top:1px;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px;}
.detail-item{display:flex;align-items:flex-start;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px;color:var(--brand-700);}

.detail-item b{display:block;font-size:11px;font-weight:700;color:var(--ink);line-height:1.3;}
.detail-item small{display:block;font-size:9.5px;color:var(--ink-soft);margin-top:2px;line-height:1.3;}
.detail-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:0 2px 4px;}
.detail-owner{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 11px;margin-top:12px;}
.detail-owner b{display:block;font-size:12px;font-weight:700;}
.detail-owner small{display:block;font-size:10px;color:var(--ink-soft);margin-top:1px;}
.detail-banner{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:14px;color:var(--ink-soft);}
.detail-banner.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 22%,var(--line));color:var(--ok);}
.detail-banner b{display:block;font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3;}
.detail-banner small{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
.detail-banner svg{flex-shrink:0;margin-top:1px;}
.detail-hint{text-align:center;font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.4;}
.detail-admin{display:flex;gap:8px;margin-top:9px;}
.detail-admin .btn{flex:1;}
.page-pad > .btn.block{margin-top:12px;}

/* Escáner */
.scan-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 2px 12px;}
.scan-title{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:21px;line-height:1.15;letter-spacing:-.01em;margin-top:3px;}
.scan-sub{font-size:10.5px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
.scan-pick{width:100%;display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left;color:var(--ink);margin-bottom:8px;}
.scan-pick-ico{width:36px;height:36px;border-radius:10px;background:var(--brand-100);color:var(--brand-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.scan-pick-body{flex:1;min-width:0;}
.scan-pick-body b{display:block;font-size:12.5px;font-weight:700;line-height:1.3;}
.scan-pick-body small{display:block;font-size:10.5px;color:var(--ink-soft);margin-top:2px;}
.scanner{position:relative;aspect-ratio:1/1;max-height:52dvh;border-radius:20px;overflow:hidden;background:#0E1410;border:1px solid #000;margin-bottom:10px;}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92;}
.scan-frame{position:absolute;top:50%;left:50%;width:66%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:14px;box-shadow:0 0 0 100vmax rgba(6,10,8,.35);}
.scan-frame span.c1,.scan-frame span.c2,.scan-frame span.c3,.scan-frame span.c4{position:absolute;width:26px;height:26px;border:3px solid #fff;border-radius:4px;}
.scan-frame .c1{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:12px 0 0 0;}
.scan-frame .c2{top:-1px;right:-1px;border-left:0;border-bottom:0;border-radius:0 12px 0 0;}
.scan-frame .c3{bottom:-1px;left:-1px;border-right:0;border-top:0;border-radius:0 0 0 12px;}
.scan-frame .c4{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 12px 0;}
.scan-frame .scan-line{left:10px;right:10px;top:12%;animation:scanY 2.4s ease-in-out infinite;}
@keyframes scanY{0%,100%{top:12%;opacity:.35}50%{top:86%;opacity:1}}
.scanner-hint{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(8,10,8,.62);color:#F2F1EA;font-size:10.5px;line-height:1.4;padding:7px 10px;border-radius:10px;text-align:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:3;}
.scan-actions{display:flex;gap:8px;margin-bottom:4px;}
.scan-actions .btn{flex:1;}
.manual-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;}
.manual-card p{font-size:11px;color:var(--ink-soft);line-height:1.5;margin-bottom:9px;}
.manual-row{display:flex;gap:8px;align-items:center;}
.manual-row .search-input.plain{flex:1;}
.manual-row .btn{flex-shrink:0;}
.manual-hint{display:block;font-size:9.5px;color:var(--muted);margin-top:7px;}

/* QR estudiante */
.qr-card{gap:10px;}
.qr-head{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;}
.qr-head .tag{margin:0;}
.qr-pts{font-size:11.5px;font-weight:800;color:var(--brand-700);}
.qr-frame{width:min(232px,70vw);height:auto;aspect-ratio:1/1;padding:12px;}
.qr-frame svg{width:100%;height:100%;display:block;}
.qr-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);}
.qr-code{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--brand-700);text-align:center;margin-top:-4px;}
.qr-event{font-size:11px;color:var(--ink-soft);text-align:center;line-height:1.35;}
.qr-actions{display:flex;gap:8px;width:100%;}
.qr-actions .btn{flex:1;}
.timer-dot{width:7px;height:7px;border-radius:50%;background:var(--brand-600);display:inline-block;flex-shrink:0;}
.timer-dot.pulse{animation:dotPulse .6s ease;}
@keyframes dotPulse{0%{transform:scale(1);opacity:1}50%{transform:scale(1.8);opacity:.4}100%{transform:scale(1);opacity:1}}
.note-card{display:flex;align-items:flex-start;gap:9px;background:var(--brand-50);border:1px solid color-mix(in srgb,var(--brand) 12%,var(--line));border-radius:13px;padding:11px 13px;margin-top:12px;color:var(--brand-700);}
.note-card svg{flex-shrink:0;margin-top:1px;}
.note-card p{font-size:10.5px;line-height:1.55;color:var(--ink-soft);}
.note-card b{color:var(--brand-800);}

/* Recompensas */
.reward-hero{display:flex;align-items:center;justify-content:space-between;gap:12px;background:radial-gradient(120% 120% at 100% 0%,rgba(255,255,255,.16),transparent 50%),linear-gradient(150deg,#C22A2A,var(--brand-800) 60%,var(--brand-900));color:#F7F1E6;border-radius:18px;padding:16px 17px;margin-bottom:4px;}
.reward-hero .eyebrow{color:rgba(255,255,255,.72);}
.reward-balance{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:34px;line-height:1;letter-spacing:-.02em;margin-top:3px;}
.reward-balance span{font-family:'Inter',sans-serif;font-size:12px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:0;}
.reward-level{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.14);border-radius:20px;padding:6px 10px;font-size:10px;font-weight:800;white-space:nowrap;}
.reward-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.reward-card{display:flex;flex-direction:column;align-items:stretch;gap:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin:0;box-shadow:var(--shadow-sm);}
.reward-ico{width:38px;height:38px;border-radius:11px;background:var(--brand-100);color:var(--brand-700);display:flex;align-items:center;justify-content:center;margin-bottom:9px;}
.reward-card.locked .reward-ico{background:color-mix(in srgb,var(--line) 45%,transparent);color:var(--muted);}
.reward-title{font-size:12px;font-weight:700;line-height:1.3;color:var(--ink);}
.reward-desc{font-size:10px;color:var(--ink-soft);line-height:1.4;margin-top:3px;flex:1;}
.reward-foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px;}
.reward-cost{display:block;font-size:11px;font-weight:800;color:var(--brand-700);white-space:nowrap;}
.reward-card.locked .reward-cost{color:var(--muted);}
.reward-card .btn.xs{flex-shrink:0;}

/* Perfil */
.profile-head{flex-direction:column;text-align:center;gap:0;padding:22px 16px 18px;}
.profile-head h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:22px;line-height:1.15;margin-top:10px;color:var(--ink);}
.profile-role{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-700);margin-top:5px;}
.profile-fac{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.4;}
.profile-level{display:inline-flex;align-items:center;gap:5px;background:var(--brand-50);border:1px solid color-mix(in srgb,var(--brand) 16%,var(--line));color:var(--brand-800);font-size:10.5px;font-weight:800;border-radius:20px;padding:6px 11px;margin-top:10px;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px;}
.stats-row.tight{margin:0 0 12px;}
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.badge{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;font-size:10.5px;font-weight:700;color:var(--muted);}
.badge-ico{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--line) 45%,transparent);color:var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.badge.on{color:var(--ink);}
.badge.on .badge-ico{background:var(--brand-100);color:var(--brand-700);}
.level-card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-top:10px;}
.level-card-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:9px;}
.level-card-head b{color:var(--brand-700);font-size:11.5px;}
.level-track.big{height:8px;background:color-mix(in srgb,var(--line) 60%,transparent);}
.level-track.big .level-fill{background:linear-gradient(90deg,var(--brand-600),var(--brand-800));}
.level-card-foot{font-size:10px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
.level-card-foot b{color:var(--brand-800);}
.about-card{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-top:16px;}
.about-card b{display:block;font-size:12px;font-weight:700;}
.about-card small{display:block;font-size:10px;color:var(--ink-soft);line-height:1.5;margin-top:2px;}

/* Ajustes / datos */
.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.data-cell{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px 12px;}
.data-cell.wide{grid-column:span 2;}
.data-cell b{display:block;font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:20px;line-height:1;color:var(--ink);}
.data-cell span{display:block;font-size:9.5px;color:var(--ink-soft);margin-top:4px;font-weight:600;}

/* Formularios */
.form{display:flex;flex-direction:column;gap:12px;}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;}
.field > span{font-size:11px;font-weight:800;letter-spacing:.02em;color:var(--ink-soft);}
.field input,.field select,.field textarea{width:100%;border:1.3px solid var(--line);border-radius:12px;padding:12px 13px;font-size:16px;color:var(--ink);background:var(--card);outline:0;transition:border-color .15s ease,box-shadow .15s ease;}
.field textarea{resize:vertical;min-height:78px;line-height:1.45;}
.field select{appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2398A095' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 13px center;padding-right:38px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-600);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-600) 14%,transparent);}
.field input[type="date"],.field input[type="time"]{min-height:46px;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;min-width:0;}
.switch-field{position:relative;display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer;}
.switch-field b{display:block;font-size:12px;font-weight:700;color:var(--ink);line-height:1.3;}
.switch-field small{display:block;font-size:10px;color:var(--ink-soft);margin-top:2px;line-height:1.4;}
.switch-field input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;}
.switch{width:42px;height:24px;border-radius:20px;background:var(--line);position:relative;flex-shrink:0;transition:background .18s ease;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s ease;}
.switch-field input:checked + .switch{background:var(--brand-600);}
.switch-field input:checked + .switch::after{transform:translateX(18px);}
.switch-field input:focus-visible + .switch{outline:2px solid var(--brand-600);outline-offset:2px;}
.form-actions{display:flex;gap:9px;margin-top:6px;}
.form-actions .btn{flex:1;}

/* Toast */
.toast-root{position:fixed;left:50%;bottom:calc(94px + var(--safe-b));transform:translateX(-50%);z-index:120;width:max-content;max-width:min(88vw,420px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;}
.toast-root.show{opacity:1;}
.toast{display:flex;align-items:center;gap:8px;background:#1C2420;color:#F7F5EE;font-size:12px;font-weight:600;line-height:1.4;padding:11px 15px;border-radius:12px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);}
.toast svg{flex-shrink:0;}
.toast.success{background:#14532D;color:#EAF7EF;}
.toast.error{background:var(--danger);color:#fff;}
html[data-theme="dark"] .toast{background:#F4F2EA;color:#1C2420;}
@media (prefers-color-scheme: dark){html[data-theme="auto"] .toast{background:#F4F2EA;color:#1C2420;}}

/* Confirmación */
#confirm-root{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;}
#confirm-root.open{display:flex;}
#confirm-root .overlay{position:absolute;inset:0;background:rgba(10,12,10,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .18s ease;}
#confirm-root .sheet{z-index:1;animation:slideUp .24s cubic-bezier(.22,1,.36,1);}
#confirm-root .sheet h3{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:21px;line-height:1.2;color:var(--ink);margin-bottom:6px;}
#confirm-root .sheet p{font-size:13px;color:var(--ink-soft);line-height:1.6;}
#confirm-root .sheet p b{color:var(--ink);}
.sheet-grip{display:none;}

/* Ajustes finos */
.crud-title{display:block;}
.crud-title .tag{margin:0 0 0 5px;vertical-align:1px;}
.account-list{margin-top:2px;}
@media (max-width:359px){
  .reward-grid{grid-template-columns:1fr;}
  .detail-grid{grid-template-columns:1fr;}
  .quick small{display:none;}
}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };
