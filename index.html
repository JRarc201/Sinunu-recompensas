function localISO(d = new Date()) {
  const t = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return t.toISOString().slice(0, 10);
}
function parseISO(iso) {
  const [y, m, d] = String(iso || '').split('-').map(Number);
  return new Date(y || 1970, (m || 1) - 1, d || 1);
}
function addDaysISO(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return localISO(d);
}
function dayDiff(a, b) {
  return Math.round((parseISO(b) - parseISO(a)) / 86400000);
}
function dm(iso) {
  const d = parseISO(iso);
  return { d: String(d.getDate()).padStart(2, '0'), m: MONTHS[d.getMonth()] };
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = parseISO(iso);
  return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtTime(t) {
  if (!t) return '';
  const [h, m] = String(t).split(':').map(Number);
  const ap = h >= 12 ? 'p. m.' : 'a. m.';
  const hh = h % 12 || 12;
  return `${hh}:${String(m || 0).padStart(2, '0')} ${ap}`;
}
function relDay(iso) {
  const diff = dayDiff(localISO(), iso);
  if (diff === 0) return 'Hoy';
  if (diff === 1) return 'Mañana';
  if (diff > 1) return `En ${diff} días`;
  if (diff === -1) return 'Ayer';
  return `Hace ${Math.abs(diff)} días`;
}
function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'Ahora';
  if (m < 60) return `Hace ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 24) return `Hace ${h} h`;
  return `Hace ${Math.floor(h / 24)} d`;
}
function initials(name) {
  const p = String(name || '').trim().split(/\s+/).filter(Boolean);

}

function loadDB() {
  try {

    if (!raw) return seed();
    const data = JSON.parse(raw);
    if (!data || !Array.isArray(data.users) || !Array.isArray(data.events)) return seed();
    data.attendance = data.attendance || [];
    data.redemptions = data.redemptions || [];
    data.rewards = data.rewards || seed().rewards;
    data.settings = data.settings || { theme: 'auto' };
    data.session = data.session || null;
    return data;
  } catch (err) {
    return seed();
  }
}

function levelInfo(points) {
  let i = 0;
  for (let k = 0; k < LEVELS.length; k++) if (points >= LEVELS[k].min) i = k;
  const cur = LEVELS[i];
  const next = LEVELS[i + 1] || null;
  return {
    name: cur.name,
    next,
    remaining: next ? Math.max(0, next.min - points) : 0,
    pct: next ? clamp(((points - cur.min) / (next.min - cur.min)) * 100, 0, 100) : 100
  };
}

  return DB.attendance.some((a) => a.eventId === eventId && a.userId === userId);

function registerAttendance(eventId, userId) {
  const ev = eventById(eventId);
  const u = getUser(userId);
  if (!ev) return { ok: false, msg: 'El evento no existe' };
  if (!u) return { ok: false, msg: 'El código no está registrado' };
  if (u.role !== 'student') return { ok: false, msg: 'El código no pertenece a un estudiante' };
  if (u.active === false) return { ok: false, msg: `${u.name} está inactivo` };
  if (!ev.active) return { ok: false, msg: 'El registro de este evento está cerrado' };
  if (hasAttended(eventId, userId)) return { ok: false, msg: `${u.name} ya estaba registrado` };

  DB.attendance.push({
    id: uid('at'),
    eventId,
    userId,
    points: Number(ev.points) || 0,
    at: new Date().toISOString()
  });
  u.points = (Number(u.points) || 0) + (Number(ev.points) || 0);
  save();
  return { ok: true, msg: `${u.name} · +${ev.points} pts`, user: u, event: ev };
}

    danger: true
  });
  if (!ok) return;
  DB.events = DB.events.filter((e) => e.id !== id);
  DB.attendance = DB.attendance.filter((a) => a.eventId !== id);
  if (S.page && S.page.name === 'event' && S.page.id === id) S.page = null;
  if (S.filters.scanEvent === id) S.filters.scanEvent = null;
  save();
  toast('Evento eliminado');
  render();
}

async function deleteUserFlow(id) {
  const u = getUser(id);
  if (!u) return;
  if (u.role === 'admin') {
    toast('No se puede eliminar al administrador', 'error');
    return;
  }
  if (currentUser() && currentUser().id === id) {
    toast('No puedes eliminar tu propia cuenta', 'error');
    return;
  }
  const ok = await confirmDialog({
    title: 'Eliminar usuario',
    message: `Se eliminará a <b>${esc(u.name)}</b> junto con su historial de asistencias y canjes. Esta acción no se puede deshacer.`,
    ok: 'Eliminar',
    danger: true
  });
  if (!ok) return;
  DB.users = DB.users.filter((x) => x.id !== id);
  DB.attendance = DB.attendance.filter((a) => a.userId !== id);
  DB.redemptions = DB.redemptions.filter((r) => r.userId !== id);
  save();
  toast('Usuario eliminado');
  render();
}

/* -------------------------------- Tema ------------------------------------ */
function applyTheme() {
  const mode = (DB.settings && DB.settings.theme) || 'auto';
  document.documentElement.setAttribute('data-theme', mode);
  const dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dark ? '#151513' : '#FAF8F3');
}

/* ------------------------------ Render base ------------------------------- */
const app = $('#app');

function render() {
  if (S.qr.timer) {
    clearInterval(S.qr.timer);
    S.qr.timer = null;
  }
  stopScanner();

  const user = currentUser();
  if (!user) {
    renderLogin();
    return;
  }
  const allowed = TABS[user.role] || TABS.student;
  if (!S.tab || !allowed.some((t) => t.id === S.tab)) S.tab = defaultTab(user.role);

  if (S.page) {
    renderPage(user);
    return;
  }

  const viewFn = VIEWS[S.tab] || VIEWS.home;
  const body = viewFn(user);
  app.innerHTML = topbar(user) + `<main class="view" id="view">${body}</main>` + tabbar(user);
  afterRender(user);
}

function afterRender(user) {
  if (S.page) return;
  if (S.tab === 'qr') initQR();
  if (S.tab === 'scan') initScan();
}

function renderPage(user) {
  const page = S.page;
  let body = '';
  if (page.name === 'event') {
    body = eventDetail(user, page.id);
  } else if (page.name === 'event-form') {
    body = eventForm(user, page.id);
  } else if (page.name === 'user-form') {
    body = userForm(user, page.id);
  }
  app.innerHTML = topbar(user) + `<main class="view page" id="view">${body}</main>`;
}

function topbar(user) {
  let left = '';
  const meta = TAB_META[S.tab] || { title: 'UniSinú' };

  if (S.page) {
    left = `<button class="icon-btn ghost" data-action="back" aria-label="Volver">${icon('back', { size: 20 })}</button>
      <div class="tb-title">${esc(S.page.title || meta.title)}</div>`;
  } else if (S.tab === 'home' || S.tab === 'tevents' || S.tab === 'dash') {
    let name = 'UniSinú';
    let sub = 'Recompensas por asistencia';
    if (S.tab === 'tevents') {
      name = 'Mis eventos';
      sub = `${user.name} · ${user.faculty}`;
    } else if (S.tab === 'dash') {
      name = 'Panel general';
      sub = 'Universidad del Sinú';
    }
    const chip = S.tab === 'home' ? '' : `<span class="role-chip">${roleLabel(user.role)}</span>`;
    left = `<div class="brand">${seal(34)}<div><div class="brand-name">${esc(name)}${chip}</div><div class="brand-sub">${esc(sub)}</div></div></div>`;
  } else {
    left = `<div class="tb-title">${esc(meta.title)}</div>`;
  }

  let right = '';
  if (!S.page && S.tab === 'rewards') {
    right = `<div class="pts-chip">${fmt(user.points)} pts</div>`;
  } else {
    right = `<button class="avatar" data-action="go-profile" aria-label="Ir al perfil">${esc(initials(user.name))}</button>`;
  }

  return `<header class="topbar"><div class="topbar-left">${left}</div><div class="topbar-right">${right}</div></header>`;
}

function tabbar(user) {
  const tabs = TABS[user.role] || TABS.student;
  const items = tabs.map((t) => `
    <button class="nav-btn ${S.tab === t.id ? 'active' : ''} ${t.center ? 'center' : ''}" data-action="tab" data-tab="${t.id}" aria-label="${esc(t.label)}" ${S.tab === t.id ? 'aria-current="page"' : ''}>
      <span class="ico-wrap">${icon(t.icon, { size: t.center ? 23 : 21 })}</span>
      <span class="nav-label">${esc(t.label)}</span>
    </button>`).join('');
  return `<nav class="tabbar" style="--tabs:${tabs.length}" aria-label="Navegación principal">${items}</nav>`;
}

/* ------------------------------ Componentes ------------------------------- */
function emptyState(iconName, title, text) {
  return `<div class="empty">
    <div class="empty-icon">${icon(iconName, { size: 22 })}</div>
    <b>${esc(title)}</b>
    <p>${esc(text)}</p>
  </div>`;
}

function balanceCard(user) {
  const lv = levelInfo(user.points);
  const levelText = lv.next
    ? `Nivel ${lv.name} · ${fmt(lv.remaining)} pts para ${lv.next.name}`
    : `Nivel ${lv.name} · nivel máximo`;
  return `<section class="balance-card" aria-label="Saldo de puntos">
    <span class="ring r1"></span><span class="ring r2"></span>
    <div class="balance-label">MIS PUNTOS</div>
    <div class="balance-row"><span class="balance-num">${fmt(user.points)}</span><span class="balance-unit">pts UniSinú</span></div>
    <div class="level-row">
      <div class="level-track"><div class="level-fill" style="width:${lv.pct}%"></div></div>
      <div class="level-text">${esc(levelText)}</div>
    </div>
  </section>`;
}

function eventCard(ev, user) {
  const { d, m } = dm(ev.date);
  const attended = hasAttended(ev.id, user.id);
  let tag = '';
  if (attended) tag = `<span class="tag ok">${icon('check', { size: 11, sw: 2.2 })} Asististe</span>`;
  else if (!ev.active) tag = `<span class="tag off">Finalizado</span>`;
  else if (ev.date === localISO()) tag = `<span class="tag brand">Hoy · registro abierto</span>`;
  return `<button class="event-card ${!ev.active ? 'dim' : ''}" data-action="event" data-id="${ev.id}" data-searchable="${esc((ev.title + ' ' + ev.place + ' ' + ev.faculty).toLowerCase())}">
    <span class="date-chip"><b>${d}</b><span>${m}</span></span>
    <span class="event-body">
      <span class="event-title">${esc(ev.title)}</span>
      <span class="event-meta">${esc(ev.place)} · ${esc(fmtTime(ev.time))}</span>
      ${tag}
    </span>
    <span class="event-pts">+${ev.points} pts</span>
  </button>`;
}

VIEWS.events = function (user) {
  const filter = S.filters.events;
  const all = DB.events.slice().sort(byDateAsc);
  let list = all;
  if (filter === 'upcoming') list = all.filter((e) => e.active && dayDiff(localISO(), e.date) >= 0);
  if (filter === 'past') list = all.filter((e) => !e.active || dayDiff(localISO(), e.date) < 0).sort(byDateDesc);
  if (filter === 'attended') list = all.filter((e) => hasAttended(e.id, user.id)).sort(byDateDesc);
  if (filter === 'all') {
    list = all.filter((e) => e.active && dayDiff(localISO(), e.date) >= 0).sort(byDateAsc)
      .concat(all.filter((e) => !e.active || dayDiff(localISO(), e.date) < 0).sort(byDateDesc));
  }

  const total = all.filter((e) => e.active).length;
  const mine = all.filter((e) => hasAttended(e.id, user.id)).length;

  return `
    <div class="page-intro">
      <h2>Eventos del campus</h2>
      <p>${fmt(total)} eventos activos · ${fmt(mine)} en tu historial</p>
    </div>
    <div class="search-wrap">
      ${icon('search', { size: 17 })}
      <input id="event-search" class="search-input" type="search" placeholder="Buscar evento, lugar o facultad" autocomplete="off" aria-label="Buscar eventos">
    </div>
    <div class="chips" role="group" aria-label="Filtrar eventos">
      ${[['upcoming', 'Próximos'], ['all', 'Todos'], ['past', 'Finalizados'], ['attended', 'Mis asistencias']].map(([v, l]) => `
        <button class="chip ${filter === v ? 'active' : ''}" data-action="events-filter" data-filter="${v}">${l}</button>`).join('')}

    <div class="stack" id="event-list">
      ${list.length ? list.map((e) => eventCard(e, user)).join('') : emptyState('calendar', 'Nada por aquí', 'Prueba con otro filtro o revisa más tarde.')}

    <div class="no-results" id="event-no-results" hidden>${emptyState('search', 'Sin coincidencias', 'No encontramos eventos con ese texto.')}</div>`;

    return `<div class="page-intro"><h2>Mi código QR</h2><p>Identifícate ante el profesor en cada evento.</p></div>

  if (!S.filters.qrEvent || !options.some((e) => e.id === S.filters.qrEvent)) {

  return `
    <div class="page-intro">
      <h2>Mi código QR</h2>
      <p>Muéstralo al profesor para registrar tu asistencia.</p>

    </div>` : ''}

      <div class="qr-head">

/* ==========================================================================
   Detalle de evento
   ========================================================================== */
function eventDetail(user, id) {
  const ev = eventById(id);
  if (!ev) {
    return `<div class="page-pad">${emptyState('alert', 'Evento no encontrado', 'Puede que haya sido eliminado.')}</div>`;
  }
  const { d, m } = dm(ev.date);
  const owner = getUser(ev.ownerId);
  const attended = hasAttended(ev.id, user.id);
  const count = attendanceOf(ev.id).length;
  const isStudent = user.role === 'student';
  const canRegister = ev.active && dayDiff(localISO(), ev.date) >= 0;

  const hero = `
    <div class="detail-hero">
      <div class="detail-date"><b>${d}</b><span>${m}</span><small>${parseISO(ev.date).getFullYear()}</small></div>
      <div class="detail-hero-body">
        <span class="tag ${ev.active ? 'brand' : 'off'}">${ev.active ? 'Registro abierto' : 'Finalizado'}</span>
        <h2>${esc(ev.title)}</h2>
        <div class="detail-sub">${esc(ev.faculty)}</div>
      </div>
    </div>
    <div class="detail-points">
      <span>${icon('star', { size: 18 })}</span>
      <div><b>+${ev.points} puntos</b><small>por asistencia verificada</small></div>
    </div>
    <div class="detail-grid">
      <div class="detail-item">${icon('calendar', { size: 17 })}<div><b>${esc(fmtDate(ev.date))}</b><small>${esc(relDay(ev.date))}</small></div></div>
      <div class="detail-item">${icon('clock', { size: 17 })}<div><b>${esc(fmtTime(ev.time))}</b><small>Hora de inicio</small></div></div>
      <div class="detail-item">${icon('pin', { size: 17 })}<div><b>${esc(ev.place)}</b><small>Lugar</small></div></div>
      <div class="detail-item">${icon('users', { size: 17 })}<div><b>${fmt(count)} asistentes</b><small>${isStudent && attended ? 'Ya estás registrado' : 'Registro en el lugar'}</small></div></div>
    </div>
    <div class="section-label">DESCRIPCIÓN</div>
    <p class="detail-desc">${esc(ev.desc || 'Sin descripción adicional.')}</p>
    ${owner ? `<div class="detail-owner"><span class="avatar sm">${esc(initials(owner.name))}</span><div><b>${esc(owner.name)}</b><small>Responsable del evento</small></div></div>` : ''}`;

  if (isStudent) {
    let cta = '';
    if (attended) {
      cta = `<div class="detail-banner ok">${icon('check', { size: 18, sw: 2.2 })}<div><b>Asistencia registrada</b><small>Ya sumaste ${ev.points} puntos por este evento.</small></div></div>`;
    } else if (!ev.active) {
      cta = `<div class="detail-banner">${icon('clock', { size: 18 })}<div><b>Evento finalizado</b><small>El registro de asistencia está cerrado.</small></div></div>`;
    } else if (!canRegister) {
      cta = `<div class="detail-banner">${icon('info', { size: 18 })}<div><b>Registro cerrado</b><small>Este evento ya pasó. Consulta los próximos eventos.</small></div></div>`;
    } else {
      cta = `<button class="btn primary block" data-action="show-qr" data-id="${ev.id}">${icon('qr', { size: 18 })} Mostrar mi QR de asistencia</button>
        <p class="detail-hint">Preséntate en el evento y muestra el código al profesor.</p>`;
    }
    return `<div class="page-pad">${hero}${cta}</div>`;
  }

  const people = attendeesOf(ev.id);
  const canScan = user.role === 'teacher' && ev.ownerId === user.id;
  const adminActions = user.role === 'admin'
    ? `<div class="detail-admin">
        <button class="btn ghost sm" data-action="edit-event" data-id="${ev.id}">${icon('edit', { size: 15 })} Editar</button>
        <button class="btn danger sm" data-action="delete-event" data-id="${ev.id}">${icon('trash', { size: 15 })} Eliminar</button>
      </div>` : '';

  return `<div class="page-pad">
    ${hero}
    ${canScan ? `<button class="btn primary block" data-action="scan-go" data-id="${ev.id}">${icon('scan', { size: 18 })} Escanear asistencias</button>` : ''}
    ${adminActions}
    <div class="section-head">
      <div class="section-label">ASISTENTES (${fmt(people.length)})</div>
    </div>
    ${people.length ? `<div class="people-list">
      ${people.map(({ record, user: u }) => `
        <div class="person">
          <span class="avatar sm">${esc(initials(u.name))}</span>
          <span class="person-body"><b>${esc(u.name)}</b><small>${esc(u.code)} · ${esc(u.faculty)}</small></span>
          <span class="person-meta"><b>+${record.points}</b><small>${esc(timeAgo(record.at))}</small></span>
        </div>`).join('')}
    </div>` : emptyState('users', 'Sin asistentes todavía', 'Las asistencias escaneadas aparecerán en esta lista.')}
  </div>`;
}

Object.assign(VIEWS, {
  tevents(user) {
    const filter = S.filters.teacherEvents;
    const all = eventsOwned(user.id);
    let list = all.slice().sort(byDateAsc);
    if (filter === 'upcoming') list = list.filter((e) => e.active && dayDiff(localISO(), e.date) >= 0);
    if (filter === 'past') list = list.filter((e) => !e.active || dayDiff(localISO(), e.date) < 0).sort(byDateDesc);
    const active = all.filter((e) => e.active).length;
    const totalAtt = DB.attendance.filter((a) => all.some((e) => e.id === a.eventId)).length;

    return `
      <div class="page-intro">
        <h2>Mis eventos</h2>
        <p>Gestiona los eventos que tienes a cargo y registra asistencias.</p>
      </div>
      <div class="stats-row tight">
        <div class="stat"><b>${fmt(all.length)}</b><span>Eventos</span></div>
        <div class="stat"><b>${fmt(active)}</b><span>Activos</span></div>
        <div class="stat"><b>${fmt(totalAtt)}</b><span>Asistencias</span></div>
      </div>
      <div class="chips" role="group" aria-label="Filtrar eventos">
        ${[['upcoming', 'Próximos'], ['all', 'Todos'], ['past', 'Finalizados']].map(([v, l]) => `
          <button class="chip ${filter === v ? 'active' : ''}" data-action="teacher-filter" data-filter="${v}">${l}</button>`).join('')}
      </div>
      <div class="crud-list">
        ${list.length ? list.map((e) => crudEventRow(e, user, true)).join('') : emptyState('calendar', 'Sin eventos', 'Crea tu primer evento con el botón +.')}
      </div>
      <button class="fab" data-action="new-event" aria-label="Crear evento">${icon('plus', { size: 24 })}</button>`;
  },

  scan(user) {
    const ev = scanEvent();
    const own = activeOwnEvents(user);

    if (!ev) {
      return `
        <div class="page-intro">
          <h2>Escanear asistencias</h2>
          <p>Elige el evento en el que estás registrando y escanea el QR del estudiante.</p>
        </div>
        ${own.length ? `<div class="section-label">TUS EVENTOS ACTIVOS</div>
          <div class="stack">
            ${own.map((e) => `<button class="scan-pick" data-action="scan-go" data-id="${e.id}">
              <span class="scan-pick-ico">${icon('calendar', { size: 19 })}</span>
              <span class="scan-pick-body">
                <b>${esc(e.title)}</b>
                <small>${esc(relDay(e.date))} · ${esc(fmtTime(e.time))} · +${e.points} pts</small>
              </span>
              <span class="chev">${icon('chevron', { size: 17 })}</span>
            </button>`).join('')}
          </div>` : emptyState('calendar', 'No tienes eventos activos', 'Crea un evento o reactiva uno existente para escanear.')}
        <div class="section-label">REGISTRO MANUAL</div>
        <div class="manual-card">
          <p>Si la cámara no está disponible, ingresa el código del estudiante.</p>
          <div class="manual-row">
            <input id="manual-code" class="search-input plain" type="text" placeholder="Ej. 0221045" autocomplete="off" aria-label="Código del estudiante">
            <button class="btn primary sm" data-action="manual-checkin">${icon('check', { size: 16 })} Registrar</button>
          </div>
          <small class="manual-hint">Disponible para cualquier evento activo tuyo.</small>
        </div>`;
    }

    const people = attendeesOf(ev.id).slice(0, 6);
    return `
      <div class="scan-head">
        <div>
          <div class="eyebrow">Escaneando para</div>
          <h2 class="scan-title">${esc(ev.title)}</h2>
          <p class="scan-sub">${esc(fmtDate(ev.date))} · ${esc(fmtTime(ev.time))} · +${ev.points} pts</p>
        </div>
        <button class="icon-btn ghost" data-action="finish-scan" aria-label="Cambiar de evento">${icon('x', { size: 19 })}</button>
      </div>

      <div class="scanner" id="scanner">
        <video id="scan-video" playsinline muted></video>
        <div class="scan-frame"><span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span><span class="scan-line"></span></div>
        <div class="scanner-hint" id="scanner-hint">${icon('camera', { size: 16 })} Iniciando cámara…</div>
      </div>

      <div class="scan-actions">
        <button class="btn ghost sm" data-action="toggle-camera" id="cam-btn">${icon('camera', { size: 16 })} <span>Detener cámara</span></button>
        <button class="btn ghost sm" data-action="simulate-scan">${icon('qr', { size: 16 })} Simular escaneo</button>

      <div class="section-label">REGISTRO MANUAL</div>

          <input id="manual-code" class="search-input plain" type="text" placeholder="Código del estudiante" autocomplete="off" aria-label="Código del estudiante">
          <button class="btn primary sm" data-action="manual-checkin">${icon('check', { size: 16 })} Registrar</button>
        </div>
      </div>

      <div class="section-head">
        <div class="section-label">ÚLTIMOS REGISTROS (${fmt(attendanceOf(ev.id).length)})</div>
        <button class="link-btn" data-action="event" data-id="${ev.id}">Ver todos ${icon('chevron', { size: 13 })}</button>
      </div>
      ${people.length ? `<div class="people-list">
        ${people.map(({ record, user: u }) => `
          <div class="person">
            <span class="avatar sm">${esc(initials(u.name))}</span>
            <span class="person-body"><b>${esc(u.name)}</b><small>${esc(u.code)} · ${esc(timeAgo(record.at))}</small></span>
            <span class="person-meta"><b>+${record.points}</b></span>
          </div>`).join('')}

  }
});

Object.assign(VIEWS, {
  dash(user) {

      .map((e) => ({ event: e, count: attendanceOf(e.id).length }))
      .sort((a, b) => b.count - a.count)
      .slice(0, 5);

    const top = students.slice().sort((a, b) => b.points - a.points).slice(0, 4);

    const recent = DB.attendance
      .slice()
      .sort((a, b) => String(b.at).localeCompare(String(a.at)))
      .slice(0, 5)
      .map((a) => ({ record: a, user: getUser(a.userId), event: eventById(a.eventId) }))
      .filter((x) => x.user && x.event);

    const totalCapacity = DB.events.length;

      <div class="dash-note">
        ${icon('spark', { size: 16 })}

      <div class="chart-card">
        ${byEvent.map(({ event, count }) => `
          <div class="chart-row">

            <div class="chart-track"><div class="chart-bar" style="width:${Math.max(4, (count / maxCount) * 100)}%"></div></div>

      <div class="section-head">

      <div class="people-list">
        ${top.map((u, i) => `

   QR, escáner, modales y acciones

/* --------------------------------- QR ------------------------------------- */
function qrPayload(user, eventId) {
  if (!S.qr.token) S.qr.token = randToken();
  return `UNISINU|${user.code}|${eventId}|${S.qr.token}|${Date.now()}`;
}

function paintQR() {
  const user = currentUser();
  const ev = eventById(S.filters.qrEvent);
  const frame = $('#qr-frame');
  if (!user || !ev || !frame) return;

  const payload = qrPayload(user, ev.id);
  try {
    const qr = qrcode(0, 'M');
    qr.addData(payload);
    qr.make();
    frame.innerHTML = qr.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
  } catch (err) {
    frame.innerHTML = `<div class="qr-loading">No se pudo generar el código</div>`;
  }
}

function initQR() {
  const user = currentUser();
  const ev = eventById(S.filters.qrEvent);
  if (!user || !ev) return;
  S.qr.remaining = 30;
  paintQR();
  updateTimerUI();

  S.qr.timer = setInterval(() => {
    S.qr.remaining -= 1;
    if (S.qr.remaining <= 0) {
      S.qr.token = randToken();
      S.qr.remaining = 30;
      paintQR();
      const dot = $('#timer-dot');
      if (dot) {
        dot.classList.remove('pulse');
        void dot.offsetWidth;
        dot.classList.add('pulse');
      }
    }
    updateTimerUI();
  }, 1000);
}

function updateTimerUI() {
  const el = $('#qr-remaining');
  if (el) el.textContent = String(Math.max(0, S.qr.remaining));
}

/* ------------------------------- Escáner ---------------------------------- */
async function initScan() {
  const ev = scanEvent();
  if (!ev) return;
  const video = $('#scan-video');
  const hint = $('#scanner-hint');
  const btn = $('#cam-btn');
  if (!video) return;

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    if (hint) hint.innerHTML = `${icon('alert', { size: 16 })} Cámara no disponible en este navegador. Usa el registro manual.`;
    if (btn) btn.style.display = 'none';
    return;
  }

  try {
    cam.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } },
      audio: false
    });
    video.srcObject = cam.stream;
    await video.play().catch(() => {});
    if (hint) hint.innerHTML = `${icon('camera', { size: 16 })} Apunta al código QR del estudiante`;
    if (btn) btn.querySelector('span').textContent = 'Detener cámara';

    if ('BarcodeDetector' in window) {
      try {
        cam.detector = new window.BarcodeDetector({ formats: ['qr_code'] });
      } catch (err) {
        cam.detector = null;
      }
    }
    if (cam.detector) {
      startDetectLoop();
    } else if (hint) {
      hint.innerHTML = `${icon('info', { size: 16 })} Tu navegador no detecta QR automáticamente. Usa el registro manual o "Simular escaneo".`;
    }
  } catch (err) {
    const msg = err && err.name === 'NotAllowedError'
      ? 'Permiso de cámara denegado. Habilítalo o usa el registro manual.'
      : err && err.name === 'NotFoundError'
        ? 'No se encontró una cámara en este dispositivo.'
        : 'No se pudo iniciar la cámara. Usa el registro manual.';
    if (hint) hint.innerHTML = `${icon('alert', { size: 16 })} ${esc(msg)}`;
    if (btn) btn.style.display = 'none';
  }
}

function startDetectLoop() {
  stopDetectLoop();
  const video = $('#scan-video');
  if (!video) return;
  cam.loop = setInterval(async () => {
    if (!cam.detector || !cam.stream || video.readyState < 2) return;
    try {
      const codes = await cam.detector.detect(video);
      if (!codes || !codes.length) return;
      const raw = codes[0].rawValue;
      if (!raw || Date.now() - cam.last < 2500) return;
      cam.last = Date.now();
      handleScanPayload(raw);
    } catch (err) {
      /* ignorar fotogramas fallidos */
    }
  }, 400);
}

function stopDetectLoop() {
  if (cam.loop) {
    clearInterval(cam.loop);
    cam.loop = null;
  }
}

function stopScanner() {
  stopDetectLoop();
  cam.detector = null;
  if (cam.stream) {
    try { cam.stream.getTracks().forEach((t) => t.stop()); } catch (err) { /* noop */ }
    cam.stream = null;
  }
  const video = $('#scan-video');
  if (video) video.srcObject = null;
}

function handleScanPayload(raw) {
  const ev = scanEvent();
  if (!ev) return;
  const text = String(raw || '').trim();
  if (!text) return;

  let code = text;
  if (text.startsWith('UNISINU|')) {
    const parts = text.split('|');
    code = parts[1] || '';
    const eventId = parts[2] || '';
    if (eventId && eventId !== ev.id) {
      toast('Ese QR pertenece a otro evento', 'error');
      return;
    }
  }
  registerByCode(code, ev);
}

function registerByCode(code, ev) {
  const student = DB.users.find((u) => u.role === 'student' && normCode(u.code) === normCode(code));
  if (!student) {
    toast(`Código ${normCode(code) || '—'} no registrado`, 'error');
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
    return false;
  }
  const res = registerAttendance(ev.id, student.id);
  if (res.ok) {
    toast(res.msg, 'success');
    if (navigator.vibrate) navigator.vibrate(70);
    render();
  } else {
    toast(res.msg, 'error');
    if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
  }
  return res.ok;
}

/* -------------------------------- Toast ----------------------------------- */
function toast(message, type = 'info') {
  let root = $('#toast-root');
  if (!root) {
    root = document.createElement('div');
    root.id = 'toast-root';
    root.className = 'toast-root';
    root.setAttribute('role', 'status');
    root.setAttribute('aria-live', 'polite');
    document.body.appendChild(root);
  }
  const ico = type === 'success' ? 'check' : type === 'error' ? 'alert' : 'info';
  root.innerHTML = `<div class="toast ${type}">${icon(ico, { size: 17, sw: 2 })}<span>${esc(message)}</span></div>`;
  root.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => root.classList.remove('show'), 2800);
}

/* ------------------------------ Confirmación ------------------------------ */
let confirmSeq = 0;

function confirmDialog({ title, message, ok = 'Confirmar', danger = false }) {
  return new Promise((resolve) => {
    confirmResolve = resolve;
    confirmSeq += 1;
    let root = $('#confirm-root');
    if (!root) {
      root = document.createElement('div');
      root.id = 'confirm-root';
      document.body.appendChild(root);
    }
    root.innerHTML = `
      <div class="overlay" data-action="sheet-backdrop"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
        <div class="sheet-grip"></div>
        <h3 id="confirm-title">${esc(title)}</h3>
        <p>${message}</p>
        <div class="sheet-actions">
          <button class="btn ghost" data-action="confirm-no">Cancelar</button>
          <button class="btn ${danger ? 'danger' : 'primary'}" data-action="confirm-yes">${esc(ok)}</button>
        </div>
      </div>`;
    requestAnimationFrame(() => root.classList.add('open'));
  });
}

function closeConfirm(result) {
  const root = $('#confirm-root');
  if (root) {
    root.classList.remove('open');
    const seq = confirmSeq;
    setTimeout(() => {
      if (seq === confirmSeq) root.innerHTML = '';
    }, 220);
  }
  if (confirmResolve) {
    const fn = confirmResolve;
    confirmResolve = null;
    fn(result);
  }
}

/* ------------------------------ Búsqueda ---------------------------------- */
function filterList(inputId, containerId, emptyId) {
  const input = $('#' + inputId);
  const container = $('#' + containerId);
  const empty = $('#' + emptyId);
  if (!input || !container) return;
  const norm = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const q = norm(input.value.trim());
  let visible = 0;
  $$('[data-searchable]', container).forEach((el) => {
    const hay = norm((el.dataset.searchable || '') + ' ' + el.textContent);
    const show = !q || hay.includes(q);
    el.hidden = !show;
    if (show) visible += 1;
  });
  $$('.empty', container).forEach((el) => { el.hidden = Boolean(q); });
  if (empty) empty.hidden = visible > 0 || !q;
}

/* ------------------------------- Formularios ------------------------------ */
function saveEventForm(form) {
  const fd = new FormData(form);
  const user = currentUser();
  if (!user) return;
  const title = String(fd.get('title') || '').trim();
  const date = String(fd.get('date') || '');
  const time = String(fd.get('time') || '');
  const place = String(fd.get('place') || '').trim();
  if (!title || !date || !time || !place) {
    toast('Completa los campos obligatorios', 'error');
    return;
  }
  const id = String(fd.get('id') || '');
  const points = clamp(Number(fd.get('points')) || 0, 0, 500);
  const ownerId = user.role === 'teacher' ? user.id : (String(fd.get('ownerId') || '') || (user.role === 'admin' ? 'a-ramiro' : user.id));
  const data = {
    title,
    faculty: String(fd.get('faculty') || FACULTIES[0]),
    date,
    time,
    place,
    points,
    desc: String(fd.get('desc') || '').trim(),
    active: fd.get('active') === 'on',
    ownerId
  };

  if (id) {
    const ev = eventById(id);
    if (!ev) return;
    Object.assign(ev, data);
    toast('Evento actualizado', 'success');
  } else {
    DB.events.push(Object.assign({ id: uid('ev') }, data));
    toast('Evento creado', 'success');
  }
  save();
  S.page = null;
  S.tab = user.role === 'admin' ? 'aevents' : 'tevents';
  render();
}

function saveUserForm(form) {
  const fd = new FormData(form);
  const id = String(fd.get('id') || '');
  const name = String(fd.get('name') || '').trim();
  const code = String(fd.get('code') || '').trim().toUpperCase();
  const existing = id ? getUser(id) : null;
  const role = String(fd.get('role') || (existing ? existing.role : 'student'));
  if (!name || !code) {
    toast('Nombre y código son obligatorios', 'error');
    return;
  }
  const dup = DB.users.find((u) => normCode(u.code) === normCode(code) && u.id !== id);
  if (dup) {
    toast('Ya existe un usuario con ese código', 'error');
    return;
  }
  const data = {
    name,
    code,
    role,
    faculty: String(fd.get('faculty') || FACULTIES[0]),
    semester: String(fd.get('semester') || '').trim(),
    points: clamp(Number(fd.get('points')) || 0, 0, 99999),
    active: fd.get('active') === 'on'
  };

  if (id) {
    const u = getUser(id);
    if (!u) return;
    if (u.role === 'admin' && role !== 'admin') {
      toast('No se puede cambiar el rol del administrador', 'error');
      return;
    }
    Object.assign(u, data);
    if (u.role !== 'student') u.points = 0;
    toast('Usuario actualizado', 'success');
  } else {
    const prefix = role === 'teacher' ? 't' : role === 'admin' ? 'a' : 'u';
    DB.users.push(Object.assign({ id: uid(prefix) }, data, role !== 'student' ? { points: 0 } : {}));
    toast('Usuario creado', 'success');
  }
  save();
  S.page = null;
  S.tab = 'users';
  render();
}

/* ------------------------------- Arranque --------------------------------- */
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;
  const fn = ACTIONS[action];
  if (!fn) return;
  e.preventDefault();
  fn(el.dataset, el);
});

document.addEventListener('input', (e) => {
  const id = e.target.id;
  if (id === 'event-search') filterList('event-search', 'event-list', 'event-no-results');
  if (id === 'admin-event-search') filterList('admin-event-search', 'admin-event-list', 'admin-event-no-results');
  if (id === 'user-search') filterList('user-search', 'user-list', 'user-no-results');
});

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target && e.target.id === 'manual-code') {
    e.preventDefault();
    ACTIONS['manual-checkin']();
  }
  if (e.key === 'Escape' && confirmResolve) closeConfirm(false);
});

document.addEventListener('submit', (e) => {
  const form = e.target;
  if (!form || !form.dataset || !form.dataset.form) return;
  e.preventDefault();
  if (form.dataset.form === 'event') saveEventForm(form);
  if (form.dataset.form === 'user') saveUserForm(form);
});

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (((DB.settings && DB.settings.theme) || 'auto') === 'auto') applyTheme();
});

window.addEventListener('beforeunload', stopScanner);

(function init() {
  try {
    const demo = new URLSearchParams(location.search).get('demo');
    if (demo) {
      const u = getUser(demo) || DB.users.find((x) => x.role === demo && x.active !== false);
      if (u) {
        DB.session = { userId: u.id, since: new Date().toISOString() };
        S.tab = defaultTab(u.role);
      }
    }
  } catch (err) { /* sin parámetros de demostración */ }
  applyTheme();
  render();
})();

</script>
